! Stage 1 (pre): 2D-axisymmetric DSMC with radial weighting. Produces a DSMCState
! carrying WeightingFactorCell, the seed for the cell_local adaption in stage 2.
IniExactFunc  = 0
N             = 1
NAnalyze      = 1

MeshFile       = cube_mesh.h5
useCurveds     = F
TrackingMethod = triatracking

ProjectName     = 2DAxi_CellLocal_Seed
IterDisplayStep = 5
CalcTemp        = T
CalcNumDens     = T

tend       = 2.0E-9
Analyze_dt = 2.0E-9
CFLscale   = 0.2

Part-maxParticleNumber = 500000
Part-nSpecies = 1
Part-nBounds  = 6
Part-Boundary1-SourceName = BC_Xplus
Part-Boundary1-Condition  = reflective
Part-Boundary2-SourceName = BC_Xminus
Part-Boundary2-Condition  = reflective
Part-Boundary3-SourceName = BC_Yplus
Part-Boundary3-Condition  = reflective
Part-Boundary4-SourceName = BC_Yminus
Part-Boundary4-Condition  = symmetric_axis
Part-Boundary5-SourceName = BC_Zplus
Part-Boundary5-Condition  = symmetric_dim
Part-Boundary6-SourceName = BC_Zminus
Part-Boundary6-Condition  = symmetric_dim

! Species1 - O2
Part-Species1-MassIC              = 5.31352E-26
Part-Species1-MacroParticleFactor = 1E2

Part-Species1-nInits = 1
Part-Species1-Init1-SpaceIC              = cell_local
Part-Species1-Init1-velocityDistribution = maxwell_lpn
Part-Species1-Init1-PartDensity          = 1E+21
Part-Species1-Init1-VeloIC               = 0
Part-Species1-Init1-VeloVecIC            = (/1.,0.,0./)
Part-Species1-Init1-MWTemperatureIC      = 5000
Part-Species1-Init1-TempVib              = 5000
Part-Species1-Init1-TempRot              = 5000

ManualTimeStep          = 1.0000E-10
Particles-HaloEpsVelo   = 2.0E+03
Particles-NumberForDSMCOutputs = 1
Part-TimeFracForSampling       = 1
Particles-DSMC-CalcSurfaceVal  = F
UseDSMC                        = true
Particles-DSMC-CollisMode      = 2
Part-NumberOfRandomSeeds = 2
Particles-RandomSeed1    = 1
Particles-RandomSeed2    = 2
Particles-DSMC-UseOctree = false
! Required so that DSMC_MCS_over_MFP ends up in the DSMCState
Particles-DSMC-CalcQualityFactors = T

Particles-Symmetry-Order          = 2
Particles-Symmetry2DAxisymmetric  = T

Part-Weight-Type               = radial
Part-Weight-Radial-ScaleFactor = 10
Part-Weight-CloneMode          = 2
Part-Weight-CloneDelay         = 2
