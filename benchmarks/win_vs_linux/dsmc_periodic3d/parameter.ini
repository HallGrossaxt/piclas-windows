! =============================================================================== !
! EQUATION (linearscalaradvection)
! =============================================================================== !
IniExactFunc  = 0
! =============================================================================== !
! DISCRETIZATION
! =============================================================================== !
N             = 1  ! Polynomial degree
NAnalyze      = 10 ! Number of analyze points
! =============================================================================== !
! MESH
! =============================================================================== !
MeshFile      = ./pre-hopr/periodic_mesh.h5
useCurveds    = T
! =============================================================================== !
! OUTPUT / VISUALIZATION
! =============================================================================== !
ProjectName      = periodic
Logging          = F
WriteErrorFiles  = F
printRandomSeeds = F
DoCalcErrorNorms = T
IterDisplayStep  = 1
! =============================================================================== !
! CALCULATION
! =============================================================================== !
tend       = 2e-2 ! End time (unchanged -> final State filename stays valid for analyze.ini)
Analyze_dt = 2e-2 ! only write at tEnd (no intermediate IO to perturb timing)
CFLscale   = 0.8  ! Scaling of theoretical CFL number
useDSMC=T
Part-SafetyFactor     = 200
! Benchmark: dt 2e-5 (was 1e-4) -> 1000 steps so the time loop dominates the one-time
! init (mesh read + domain decomposition) and the scaling reflects the solver, not startup.
ManualTimeStep        = 2.0E-5
Particles-HaloEpsVelo = 100
! =============================================================================== !
! PARTICLE TRACKING
! =============================================================================== !
!BezierClipTolerance = 1e-9
!BezierClipMaxIter   = 100
!BezierSplitLimit    = 0.6
!BezierClipHit       = 1e-7
!BezierElevation     = 0

epsilontol          = 1e-6
! Benchmark: pin ONE tracking method (the original WEK case swept all three for a
! correctness cross-check; refmapping in particular is ~10x slower and would only
! muddy the rank-scaling numbers). triatracking = the standard fast method, and it
! matches what the PIC case uses.
TrackingMethod      = triatracking
RefMappingEps       = 1e-6
RefMappingGuess     = 1
Part-LorentzType    = 3
! =============================================================================== !
! PARTICLES
! =============================================================================== !
Part-maxParticleNumber=1200000
Part-nSpecies=1

Part-Species1-ChargeIC            = -1.
Part-Species1-MassIC              = 6e-26
Part-Species1-MacroParticleFactor = 1E0

Part-Species1-nInits = 1
Part-Species1-Init1-SpaceIC              = cuboid
! Benchmark: 810k particles (~30/cell over 27000 cells) filling the FULL 2x2x2 box
! uniformly (was 100k in a 2x1x1 quarter) -> balanced static decomposition + enough
! per-rank work that transport/tracking dominates comm overhead at 4/6 ranks.
Part-Species1-Init1-ParticleNumber       = 810000
Part-Species1-Init1-MWTemperatureIC      = 8000
Part-Species1-Init1-BasePointIC          = (/0.,0.,0./)
Part-Species1-Init1-BaseVector1IC        = (/2.,0.,0./)
Part-Species1-Init1-BaseVector2IC        = (/0.,2.,0./)
Part-Species1-Init1-CuboidHeightIC       = 2.
Part-Species1-Init1-velocityDistribution = maxwell
Part-Species1-Init1-VeloIC               = 0.0
Part-Species1-Init1-VeloVecIC            = (/1.0,1.0,0.0/)
! =============================================================================== !
! BOUNDARIES
! =============================================================================== !
Part-nBounds              = 6
Part-Boundary1-SourceName = BC_periodicx+
Part-Boundary1-Condition  = periodic
Part-Boundary2-SourceName = BC_periodicx-
Part-Boundary2-Condition  = periodic
Part-Boundary3-SourceName = BC_periodicy+
Part-Boundary3-Condition  = periodic
Part-Boundary4-SourceName = BC_periodicy-
Part-Boundary4-Condition  = periodic
Part-Boundary5-SourceName = BC_periodicz+
Part-Boundary5-Condition  = periodic
Part-Boundary6-SourceName = BC_periodicz-
Part-Boundary6-Condition  = periodic
Part-nPeriodicVectors = 3

Part-FIBGMdeltas      = (/2e-1 , 2e-1 , 2e-1/)
