! Sanity check only (reggie requires an analyze.ini): confirm all particles are
! still inside the domain at tEnd. Timing is taken from std.out, not from here,
! so a flag on this check does not corrupt the benchmark numbers.
! State-file time = benchmark tEnd = 2e-8 s (F21.17 -> 000.00000002000000000).
check_hdf5_file        = HEMPT_90deg_State_000.00000002000000000.h5
check_hdf5_data_set    = PartData
check_hdf5_span        = 1 ! 1: check array elements by rows
check_hdf5_dimension   = 0:2
check_hdf5_limits      = 0.0:0.04525
